name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/wanelight.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  wanelight.exe" | Out-File -Encoding ascii target/release/wanelight.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/wanelight.exe
            target/release/wanelight.exe.sha256
