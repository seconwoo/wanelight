<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Wanelight away mode: with no input and a still screen the display fades down, and any input restores it instantly</title>
  <rect width="800" height="450" fill="#0d1117"/>
  <rect x="6" y="6" width="788" height="394" rx="10" fill="#050608" stroke="#30363d"/>
  <defs><clipPath id="scr"><rect x="6" y="6" width="788" height="394" rx="10"/></clipPath></defs>
  <g clip-path="url(#scr)">
    <!-- A bright document left open -->
    <rect x="120" y="36" width="560" height="330" rx="6" fill="#f3f4f6"/>
    <rect x="120" y="36" width="560" height="28" rx="6" fill="#e5e7eb"/>
    <g fill="#9ca3af"><rect x="160" y="96" width="320" height="12" rx="6"/></g>
    <g fill="#6b7280">
      <rect x="160" y="130" width="470" height="8" rx="4"/><rect x="160" y="148" width="440" height="8" rx="4"/><rect x="160" y="166" width="460" height="8" rx="4"/>
      <rect x="160" y="184" width="300" height="8" rx="4"/><rect x="160" y="216" width="470" height="8" rx="4"/><rect x="160" y="234" width="420" height="8" rx="4"/>
      <rect x="160" y="252" width="450" height="8" rx="4"/><rect x="160" y="270" width="380" height="8" rx="4"/><rect x="160" y="302" width="460" height="8" rx="4"/>
    </g>
    <rect x="6" y="376" width="788" height="24" fill="#1f242b"/>
    <!-- Away fade: gentle -->
    <rect x="6" y="6" width="788" height="394" fill="#000" opacity="0">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;0.7;0.7;0;0" keyTimes="0;0.33;0.61;0.69;0.7;1"/>
    </rect>
    <!-- Idle clock -->
    <g font-size="15" fill="#f5c06a" font-weight="600">
      <rect x="610" y="16" width="170" height="30" rx="15" fill="#1c1917" opacity="0.9"/>
      <text x="695" y="36" text-anchor="middle">idle 1:12<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.2;0.21;1"/></text>
      <text x="695" y="36" text-anchor="middle" opacity="0">idle 0:00<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.7;0.71;1"/></text>
      <text x="695" y="36" text-anchor="middle" opacity="0">idle 4:59<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.21;0.22;0.32;0.33;1"/></text>
      <text x="695" y="36" text-anchor="middle" opacity="0">idle 5:00 · still<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.33;0.34;0.69;0.7;1"/></text>
    </g>
    <!-- Pointer: parked, then nudged -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" values="520 300;520 300;470 262;470 262" keyTimes="0;0.69;0.72;1" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1"/>
      <path d="M0 0 L0 20 L5.5 15 L9.5 24 L13 22.5 L9 13.5 L16 13.5 Z" fill="#fff" stroke="#000" stroke-width="1.2"/>
    </g>
  </g>
  <g font-size="17" fill="#e6edf3" text-anchor="middle">
    <text x="400" y="430">You step away and leave a bright page open…<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.33;0.34;1"/></text>
    <text x="400" y="430" opacity="0">No input and nothing moving for 5 minutes: the screen fades down (off after 20)<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.34;0.35;0.69;0.7;1"/></text>
    <text x="400" y="430" opacity="0">Touch the mouse or keyboard and it is back instantly<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.7;0.71;1"/></text>
  </g>
</svg>
