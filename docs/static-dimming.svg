<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Wanelight static dimming: unchanged bright areas fade down slowly and recover instantly when they change</title>
  <rect width="800" height="450" fill="#0d1117"/>
  <rect x="6" y="6" width="788" height="394" rx="10" fill="#050608" stroke="#30363d"/>

  <!-- Chat app window (static) -->
  <rect x="30" y="30" width="400" height="300" rx="6" fill="#1b1f25"/>
  <rect x="30" y="30" width="400" height="24" rx="6" fill="#2a3038"/>
  <circle cx="44" cy="42" r="4" fill="#e8ecf1"/><rect x="56" y="38" width="90" height="8" rx="4" fill="#c9d1d9"/>
  <rect x="30" y="54" width="100" height="276" fill="#14171c"/>
  <g fill="#aab4c0">
    <rect x="42" y="70" width="70" height="8" rx="4"/><rect x="42" y="92" width="56" height="8" rx="4"/>
    <rect x="42" y="114" width="64" height="8" rx="4"/><rect x="42" y="136" width="48" height="8" rx="4"/>
    <rect x="42" y="158" width="60" height="8" rx="4"/>
  </g>
  <g>
    <rect x="146" y="72" width="200" height="34" rx="8" fill="#e8ecf1"/>
    <rect x="210" y="118" width="200" height="46" rx="8" fill="#3b82f6"/>
    <rect x="146" y="176" width="170" height="34" rx="8" fill="#e8ecf1"/>
    <rect x="146" y="290" width="270" height="26" rx="6" fill="#2a3038"/>
  </g>
  <!-- A new message arrives at 6 s -->
  <rect x="146" y="222" width="220" height="46" rx="8" fill="#e8ecf1" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6;0.61;0.97;1"/>
  </rect>

  <!-- Video player (always changing) -->
  <rect x="460" y="60" width="310" height="240" rx="6" fill="#0f141b"/>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>
    <clipPath id="vid"><rect x="470" y="70" width="290" height="190" rx="4"/></clipPath>
  </defs>
  <g clip-path="url(#vid)">
    <rect x="470" y="70" width="290" height="190" fill="url(#sky)"/>
    <circle cx="520" cy="130" r="26" fill="#fde68a">
      <animate attributeName="cx" dur="4s" repeatCount="indefinite" values="500;720;500"/>
      <animate attributeName="cy" dur="4s" repeatCount="indefinite" values="140;110;140"/>
    </circle>
    <path d="M470 230 Q530 200 590 225 T760 215 V260 H470 Z" fill="#1f2937">
      <animateTransform attributeName="transform" type="translate" dur="3s" repeatCount="indefinite" values="0 0;-30 4;0 0"/>
    </path>
  </g>
  <rect x="470" y="272" width="290" height="6" rx="3" fill="#374151"/>
  <rect x="470" y="272" width="60" height="6" rx="3" fill="#ef4444">
    <animate attributeName="width" dur="10s" repeatCount="indefinite" values="40;290"/>
  </rect>

  <!-- Taskbar (static) -->
  <rect x="6" y="366" width="788" height="34" fill="#1f242b"/>
  <g fill="#e8ecf1"><rect x="340" y="374" width="18" height="18" rx="4"/><rect x="368" y="374" width="18" height="18" rx="4"/><rect x="396" y="374" width="18" height="18" rx="4"/><rect x="424" y="374" width="18" height="18" rx="4"/></g>
  <rect x="712" y="377" width="56" height="12" rx="4" fill="#c9d1d9"/>

  <!-- Dimming (static areas only) -->
  <g fill="#000">
    <rect x="30" y="30" width="400" height="24" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.68;0.68;0" keyTimes="0;0.15;0.4;0.97;1"/></rect>
    <rect x="30" y="54" width="100" height="276" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.68;0.68;0" keyTimes="0;0.15;0.4;0.97;1"/></rect>
    <rect x="130" y="54" width="300" height="276" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.68;0.68;0;0" keyTimes="0;0.15;0.4;0.6;0.63;1"/></rect>
    <rect x="6" y="366" width="788" height="34" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.68;0.68;0" keyTimes="0;0.15;0.4;0.97;1"/></rect>
  </g>

  <!-- Captions -->
  <g font-size="17" fill="#e6edf3" text-anchor="middle">
    <text x="400" y="430" opacity="0">Full brightness to start<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.14;0.15;1"/></text>
    <text x="400" y="430" opacity="0">Unchanged, bright areas fade down slowly · the video keeps playing untouched<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.15;0.16;0.6;0.61;1"/></text>
    <text x="400" y="430" opacity="0">Something changes? That area is back to full brightness at once<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.61;0.62;1"/></text>
  </g>
</svg>
