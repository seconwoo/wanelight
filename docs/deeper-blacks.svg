  <g font-size="17" fill="#e6edf3" text-anchor="middle">
    <text x="400" y="430">A dark theme is still made of dark grays, and every one of those pixels is lit…<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;0.4;0.41;0.94;0.95;1"/></text>
    <text x="400" y="430" opacity="0">Deeper blacks turns them true black, so those pixels switch off<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4;0.41;0.9;0.91;1"/></text>
