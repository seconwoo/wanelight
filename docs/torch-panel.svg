<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Wanelight torch mode, panel style: only the panel under the pointer stays lit, and while typing only the text box</title>
  <rect width="800" height="450" fill="#0d1117"/>
  <rect x="6" y="6" width="788" height="394" rx="10" fill="#050608" stroke="#30363d"/>
  <defs><clipPath id="scr"><rect x="6" y="6" width="788" height="394" rx="10"/></clipPath></defs>
  <g clip-path="url(#scr)">
    <!-- Sidebar -->
    <rect x="6" y="6" width="144" height="394" fill="#171b21"/>
    <circle cx="28" cy="30" r="9" fill="#f5c06a"/><rect x="44" y="26" width="70" height="8" rx="4" fill="#e8ecf1"/>
    <g fill="#aab4c0"><rect x="20" y="64" width="110" height="8" rx="4"/><rect x="20" y="88" width="90" height="8" rx="4"/><rect x="20" y="112" width="104" height="8" rx="4"/><rect x="20" y="136" width="80" height="8" rx="4"/><rect x="20" y="160" width="96" height="8" rx="4"/><rect x="20" y="184" width="70" height="8" rx="4"/></g>
    <rect x="14" y="80" width="128" height="24" rx="6" fill="#ffffff" opacity="0.08"/>
    <!-- Chat pane -->
    <rect x="150" y="6" width="320" height="394" fill="#1b1f25"/>
    <rect x="166" y="30" width="190" height="40" rx="10" fill="#e8ecf1"/>
    <rect x="262" y="84" width="190" height="56" rx="10" fill="#3b82f6"/>
    <rect x="166" y="154" width="240" height="70" rx="10" fill="#e8ecf1"/>
    <rect x="166" y="238" width="160" height="40" rx="10" fill="#e8ecf1"/>
    <rect x="170" y="330" width="280" height="42" rx="12" fill="#2a3038" stroke="#4b5563"/>
    <rect x="182" y="346" width="0" height="10" rx="5" fill="#e8ecf1">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;210;210;0;0" keyTimes="0;0.7167;0.9;0.9417;0.95;1"/>
    </rect>
    <rect x="182" y="343" width="2" height="16" fill="#f5c06a">
      <animate attributeName="x" dur="12s" repeatCount="indefinite" values="182;182;394;394;182;182" keyTimes="0;0.7167;0.9;0.9417;0.95;1"/>
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.51;1"/>
    </rect>
    <circle cx="430" cy="351" r="9" fill="#f5c06a"/>
    <!-- Right pane -->
    <rect x="470" y="6" width="324" height="394" fill="#14171c"/>
    <rect x="470" y="6" width="324" height="30" fill="#1f242b"/>
    <rect x="482" y="14" width="70" height="14" rx="4" fill="#2f3640"/><rect x="560" y="14" width="60" height="14" rx="4" fill="#252b33"/>
    <g>
      <rect x="486" y="54" width="120" height="8" rx="4" fill="#c084fc"/><rect x="612" y="54" width="90" height="8" rx="4" fill="#e8ecf1"/>
      <rect x="502" y="76" width="160" height="8" rx="4" fill="#7dd3fc"/><rect x="668" y="76" width="70" height="8" rx="4" fill="#fbbf24"/>
      <rect x="502" y="98" width="210" height="8" rx="4" fill="#e8ecf1"/>
      <rect x="518" y="120" width="140" height="8" rx="4" fill="#86efac"/><rect x="664" y="120" width="60" height="8" rx="4" fill="#e8ecf1"/>
      <rect x="518" y="142" width="190" height="8" rx="4" fill="#e8ecf1"/>
      <rect x="502" y="164" width="90" height="8" rx="4" fill="#c084fc"/>
      <rect x="486" y="198" width="140" height="8" rx="4" fill="#c084fc"/><rect x="632" y="198" width="100" height="8" rx="4" fill="#e8ecf1"/>
      <rect x="502" y="220" width="220" height="8" rx="4" fill="#7dd3fc"/>
      <rect x="518" y="242" width="170" height="8" rx="4" fill="#e8ecf1"/>
      <rect x="518" y="264" width="120" height="8" rx="4" fill="#86efac"/>
      <rect x="486" y="298" width="200" height="8" rx="4" fill="#e8ecf1"/>
      <rect x="502" y="320" width="150" height="8" rx="4" fill="#fbbf24"/>
    </g>

    <!-- Torch dimming (60 %) -->
    <g fill="#000">
      <rect x="6" y="6" width="144" height="394" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;0.6;0.6;0;0;0.6;0.6;0;0" keyTimes="0;0.0833;0.1042;0.3167;0.3375;0.4833;0.5042;0.9167;0.95;1"/></rect>
      <rect x="150" y="6" width="320" height="394" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;0.6;0.6;0;0" keyTimes="0;0.3167;0.3375;0.6583;0.6792;1"/></rect>
      <path d="M150 6 H470 V400 H150 Z M170 330 H450 V372 H170 Z" fill-rule="evenodd" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;0.6;0.6;0;0" keyTimes="0;0.7167;0.7375;0.9167;0.95;1"/></path>
      <rect x="470" y="6" width="324" height="394" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;0.6;0.6;0;0;0.6;0.6;0;0" keyTimes="0;0.0833;0.1042;0.4833;0.5042;0.6583;0.6792;0.9167;0.95;1"/></rect>
    </g>

    <!-- Typing badge -->
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7167;0.725;0.9167;0.925;1"/>
      <rect x="626" y="352" width="150" height="32" rx="16" fill="#f5c06a"/>
      <text x="701" y="373" font-size="14" font-weight="600" fill="#1c1917" text-anchor="middle">typing…</text>
    </g>
    <!-- Click ripple in the message box -->
    <circle cx="330" cy="352" r="4" fill="none" stroke="#f5c06a" stroke-width="2" opacity="0">
      <animate attributeName="r" dur="12s" repeatCount="indefinite" values="4;4;18;18" keyTimes="0;0.675;0.705;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.675;0.68;0.71;1"/>
    </circle>
    <!-- Pointer -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="320 200;320 200;70 180;70 180;640 200;640 200;330 352;330 352" keyTimes="0;0.2917;0.325;0.4583;0.4917;0.625;0.6583;1" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1"/>
      <path d="M0 0 L0 20 L5.5 15 L9.5 24 L13 22.5 L9 13.5 L16 13.5 Z" fill="#fff" stroke="#000" stroke-width="1.2"/>
    </g>
  </g>
  <g font-size="17" fill="#e6edf3" text-anchor="middle">
    <text x="400" y="430">Torch mode · panel style<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.083;0.084;1"/></text>
    <text x="400" y="430" opacity="0">Only the panel under the pointer stays lit<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.084;0.085;0.29;0.2917;1"/></text>
    <text x="400" y="430" opacity="0">Point at another panel and the light follows<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2917;0.293;0.623;0.625;1"/></text>
    <text x="400" y="430" opacity="0">Click into the message box…<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.625;0.627;0.715;0.7167;1"/></text>
    <text x="400" y="430" opacity="0">…and while you type, only the text box stays lit<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.7167;0.718;1"/></text>
  </g>
</svg>
