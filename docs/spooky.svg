<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 450" width="800" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Wanelight spooky mode: the torch flickers, and a shadow cat hunts a firefly in the dark, creeps up to the light and bolts</title>
  <defs>
    <clipPath id="scr"><rect x="6" y="6" width="788" height="394" rx="10"/></clipPath>
    <radialGradient id="soft">
      <stop offset="0.55" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#e2ff96" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#bef06e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#96dc50" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0.6" y2="0.8">
      <stop offset="0" stop-color="#34335a"/>
      <stop offset="0.45" stop-color="#1d1c2c"/>
    </linearGradient>
    <!-- A thin pale rim around the whole silhouette, like the baked sprite -->
    <filter id="rim" x="-30%" y="-30%" width="160%" height="160%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3.5" result="d"/>
      <feFlood flood-color="#8c9dcc"/>
      <feComposite in2="d" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- The cat, drawn in the sprite's own coordinates: feet at (0,0), facing right -->
    <g id="head">
      <ellipse rx="34" ry="30" fill="url(#fur)"/>
      <polygon points="-22.2,-20.2 -21.6,-45.5 -4.9,-28.6" fill="#1d1c2c" stroke="#1d1c2c" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="6.2,-28.4 23.6,-44.6 23.1,-19.3" fill="#1d1c2c" stroke="#1d1c2c" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="-18,-25 -20,-39 -9,-28" fill="#3a2a45"/>
      <polygon points="9,-27 21,-38 19,-23" fill="#3a2a45"/>
    </g>
    <g id="face">
      <ellipse cx="-5" cy="-3" rx="7" ry="10" fill="#ffd27a" stroke="#0b0a12" stroke-width="1.5"/>
      <ellipse cx="-3.5" cy="-3" rx="3.2" ry="8.5" fill="#140f08"/>
      <circle cx="-7.5" cy="-7" r="2.4" fill="#fff"/>
      <ellipse cx="15" cy="-2" rx="8.5" ry="11" fill="#ffd27a" stroke="#0b0a12" stroke-width="1.5"/>
      <ellipse cx="16.5" cy="-2" rx="3.4" ry="9.3" fill="#140f08"/>
      <circle cx="12" cy="-6.4" r="2.4" fill="#fff"/>
      <polygon points="24,5 30,5 27,9" fill="#6a4a6a"/>
      <path d="M19 13 Q22 17 24 14 Q26 17 29 13" fill="none" stroke="#8c9dcc" stroke-width="1.3"/>
      <g fill="none" stroke="#8c9dcc" stroke-opacity="0.55">
        <path d="M20 8 Q34 3 48 2"/><path d="M20 10 Q34 8 48 10"/><path d="M20 12 Q34 13 48 18"/>
      </g>
    </g>
  </defs>

  <rect width="800" height="450" fill="#0d1117"/>
  <rect x="6" y="6" width="788" height="394" rx="10" fill="#050608" stroke="#30363d"/>
  <g clip-path="url(#scr)">
    <!-- A busy desktop: editor on the left, document on the right, taskbar -->
    <rect x="20" y="20" width="440" height="340" rx="6" fill="#1b1f25"/>
    <rect x="20" y="20" width="440" height="26" rx="6" fill="#2a3038"/>
    <rect x="20" y="46" width="90" height="314" fill="#14171c"/>
    <g fill="#aab4c0"><rect x="32" y="62" width="60" height="7" rx="3"/><rect x="32" y="82" width="48" height="7" rx="3"/><rect x="32" y="102" width="66" height="7" rx="3"/><rect x="32" y="122" width="40" height="7" rx="3"/><rect x="32" y="142" width="56" height="7" rx="3"/></g>
    <g>
      <rect x="126" y="64" width="90" height="8" rx="4" fill="#c084fc"/><rect x="222" y="64" width="120" height="8" rx="4" fill="#e8ecf1"/>
      <rect x="142" y="86" width="150" height="8" rx="4" fill="#7dd3fc"/><rect x="298" y="86" width="80" height="8" rx="4" fill="#fbbf24"/>
      <rect x="142" y="108" width="220" height="8" rx="4" fill="#e8ecf1"/>
      <rect x="158" y="130" width="130" height="8" rx="4" fill="#86efac"/><rect x="294" y="130" width="90" height="8" rx="4" fill="#e8ecf1"/>
      <rect x="158" y="152" width="200" height="8" rx="4" fill="#e8ecf1"/>
      <rect x="142" y="174" width="70" height="8" rx="4" fill="#c084fc"/>
      <rect x="126" y="206" width="110" height="8" rx="4" fill="#c084fc"/><rect x="242" y="206" width="140" height="8" rx="4" fill="#e8ecf1"/>
      <rect x="142" y="228" width="240" height="8" rx="4" fill="#7dd3fc"/>
      <rect x="158" y="250" width="160" height="8" rx="4" fill="#e8ecf1"/><rect x="324" y="250" width="70" height="8" rx="4" fill="#fbbf24"/>
      <rect x="158" y="272" width="120" height="8" rx="4" fill="#86efac"/>
      <rect x="142" y="294" width="210" height="8" rx="4" fill="#e8ecf1"/>
      <rect x="126" y="316" width="60" height="8" rx="4" fill="#c084fc"/>
    </g>
    <rect x="480" y="40" width="300" height="320" rx="6" fill="#f3f4f6"/>
    <rect x="480" y="40" width="300" height="24" rx="6" fill="#e5e7eb"/>
    <rect x="504" y="84" width="200" height="12" rx="6" fill="#9ca3af"/>
    <g fill="#6b7280"><rect x="504" y="112" width="250" height="7" rx="3"/><rect x="504" y="128" width="236" height="7" rx="3"/><rect x="504" y="144" width="244" height="7" rx="3"/><rect x="504" y="160" width="170" height="7" rx="3"/></g>
    <rect x="504" y="184" width="252" height="100" rx="6" fill="#dbeafe"/>
    <path d="M514 272 L560 230 L600 250 L650 206 L746 240" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#6b7280"><rect x="504" y="302" width="240" height="7" rx="3"/><rect x="504" y="318" width="210" height="7" rx="3"/><rect x="504" y="334" width="226" height="7" rx="3"/></g>
    <rect x="6" y="372" width="788" height="28" fill="#1f242b"/>
    <g fill="#e8ecf1"><rect x="340" y="378" width="16" height="16" rx="4"/><rect x="366" y="378" width="16" height="16" rx="4"/><rect x="392" y="378" width="16" height="16" rx="4"/><rect x="418" y="378" width="16" height="16" rx="4"/></g>
    <rect x="716" y="381" width="54" height="10" rx="4" fill="#c9d1d9"/>

    <!-- Spooky torch: nearly black outside a circle that flickers now and then -->
    <mask id="torch" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="450">
      <rect width="800" height="450" fill="#fff"/>
      <g>
        <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" values="560 190;560 190;480 300;480 300;560 190" keyTimes="0;0.8143;0.8429;0.9429;1" calcMode="spline" keySplines="0 0 1 1;.5 0 .3 1;0 0 1 1;.4 0 .2 1"/>
        <circle r="130" fill="url(#soft)">
          <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0.15;0.9;0.1;0.7;1;1;0.3;1;1" keyTimes="0;0.1071;0.1143;0.1214;0.1286;0.1357;0.1429;0.6;0.605;0.612;1"/>
        </circle>
      </g>
    </mask>
    <rect x="0" y="0" width="800" height="450" fill="#000" mask="url(#torch)" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0.94;0.94;0" keyTimes="0;0.04;0.96;1"/>
    </rect>

    <!-- The cat lives under the dimming, so it stays faint in the dark -->
    <g opacity="0.8">
      <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite"
        values="-80 370;-80 370;230 370;230 370;270 335;310 370;310 370;460 370;460 370;460 356;460 370;-90 370;-90 370"
        keyTimes="0;0.1786;0.4286;0.4857;0.5071;0.5286;0.6429;0.75;0.8214;0.8286;0.8357;0.9143;1"/>
      <g>
        <animateTransform attributeName="transform" type="scale" dur="14s" repeatCount="indefinite" values="1 1;-1 1" keyTimes="0;0.8286" calcMode="discrete"/>
        <g transform="scale(0.45)">
          <!-- Walk -->
          <g>
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;0;1;0;1" keyTimes="0;0.4286;0.6429;0.75;0.8286" calcMode="discrete"/>
            <g filter="url(#rim)">
              <path d="M-42 -44 C-72 -52 -78 -88 -62 -108" fill="none" stroke="#1d1c2c" stroke-width="11" stroke-linecap="round">
                <animate attributeName="d" dur="1.4s" repeatCount="indefinite" values="M-42 -44 C-72 -52 -78 -88 -62 -108;M-42 -44 C-72 -46 -84 -80 -74 -104;M-42 -44 C-72 -52 -78 -88 -62 -108"/>
              </path>
              <g transform="translate(-28 -30)"><line y2="30" stroke="#15141f" stroke-width="13" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="-26;26;-26" dur="0.7s" repeatCount="indefinite"/></line></g>
              <g transform="translate(26 -30)"><line y2="30" stroke="#15141f" stroke-width="13" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="26;-26;26" dur="0.7s" repeatCount="indefinite"/></line></g>
              <ellipse cy="-38" rx="46" ry="26" fill="url(#fur)"/>
              <g transform="translate(-22 -28)"><line y2="28" stroke="#1d1c2c" stroke-width="14" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="26;-26;26" dur="0.7s" repeatCount="indefinite"/></line></g>
              <g transform="translate(32 -28)"><line y2="28" stroke="#1d1c2c" stroke-width="14" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="-26;26;-26" dur="0.7s" repeatCount="indefinite"/></line></g>
              <use xlink:href="#head" href="#head" x="48" y="-76"/>
            </g>
            <use xlink:href="#face" href="#face" x="48" y="-76"/>
          </g>
          <!-- Crouch, rear end wiggling before the pounce -->
          <g opacity="0">
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.4286;0.4857" calcMode="discrete"/>
            <g>
              <animateTransform attributeName="transform" type="rotate" values="0 0 -20;3 0 -20;0 0 -20;-3 0 -20;0 0 -20" dur="0.35s" repeatCount="indefinite"/>
              <g filter="url(#rim)">
                <path d="M-42 -32 C-72 -36 -80 -60 -68 -76" fill="none" stroke="#1d1c2c" stroke-width="11" stroke-linecap="round"/>
                <line x1="-28" y1="-18" x2="-30" y2="0" stroke="#15141f" stroke-width="13" stroke-linecap="round"/>
                <line x1="26" y1="-18" x2="30" y2="0" stroke="#15141f" stroke-width="13" stroke-linecap="round"/>
                <ellipse cy="-26" rx="48" ry="22" fill="url(#fur)"/>
                <line x1="-22" y1="-16" x2="-18" y2="0" stroke="#1d1c2c" stroke-width="14" stroke-linecap="round"/>
                <line x1="32" y1="-16" x2="36" y2="0" stroke="#1d1c2c" stroke-width="14" stroke-linecap="round"/>
                <use xlink:href="#head" href="#head" x="56" y="-60"/>
              </g>
              <use xlink:href="#face" href="#face" x="56" y="-60"/>
            </g>
          </g>
          <!-- Leap, jaws open -->
          <g opacity="0">
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.4857;0.5286" calcMode="discrete"/>
            <g filter="url(#rim)">
              <path d="M-46 -44 C-80 -50 -96 -60 -112 -66" fill="none" stroke="#1d1c2c" stroke-width="11" stroke-linecap="round"/>
              <line x1="-34" y1="-30" x2="-60" y2="-15" stroke="#15141f" stroke-width="13" stroke-linecap="round"/>
              <line x1="32" y1="-30" x2="60" y2="-17" stroke="#15141f" stroke-width="13" stroke-linecap="round"/>
              <ellipse cy="-40" rx="54" ry="25" fill="url(#fur)"/>
              <line x1="-28" y1="-28" x2="-52" y2="-12" stroke="#1d1c2c" stroke-width="14" stroke-linecap="round"/>
              <line x1="38" y1="-28" x2="62" y2="-14" stroke="#1d1c2c" stroke-width="14" stroke-linecap="round"/>
              <use xlink:href="#head" href="#head" x="60" y="-78"/>
            </g>
            <use xlink:href="#face" href="#face" x="60" y="-78"/>
            <ellipse cx="84" cy="-63" rx="7" ry="7" fill="#3b1020" stroke="#8c9dcc" stroke-width="1.5"/>
          </g>
          <!-- Sit: chewing its catch, then watching the light -->
          <g opacity="0">
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;1;0;1;0" keyTimes="0;0.5286;0.6429;0.75;0.8286" calcMode="discrete"/>
            <g filter="url(#rim)">
              <path d="M-22 -8 C-48 0 -70 -4 -74 -24" fill="none" stroke="#1d1c2c" stroke-width="11" stroke-linecap="round">
                <animate attributeName="d" dur="2.2s" repeatCount="indefinite" values="M-22 -8 C-48 0 -70 -4 -74 -24;M-22 -8 C-48 0 -66 -8 -64 -38;M-22 -8 C-48 0 -70 -4 -74 -24"/>
              </path>
              <line x1="16" y1="-44" x2="18" y2="-4" stroke="#15141f" stroke-width="13" stroke-linecap="round"/>
              <ellipse cx="-16" cy="-22" rx="30" ry="21" fill="url(#fur)"/>
              <ellipse cx="4" cy="-48" rx="30" ry="37" transform="rotate(-12.6 4 -48)" fill="url(#fur)"/>
              <line x1="30" y1="-42" x2="31" y2="-3" stroke="#1d1c2c" stroke-width="14" stroke-linecap="round"/>
              <use xlink:href="#head" href="#head" x="28" y="-100"/>
            </g>
            <use xlink:href="#face" href="#face" x="28" y="-100"/>
          </g>
        </g>
      </g>
    </g>

    <!-- A firefly, glowing above the dimming -->
    <g>
      <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" values="380,280;330,300;410,320;360,315;350,330;345,343;345,343;380,280" keyTimes="0;0.1429;0.2857;0.4286;0.4857;0.5286;0.93;1"/>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.5286;0.55;0.93;1"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;4 -5;-3 -2;0 0" dur="1.7s" repeatCount="indefinite"/>
        <circle r="16" cy="2" fill="url(#glow)"><animate attributeName="opacity" values="1;0.4;1" dur="1.3s" repeatCount="indefinite"/></circle>
        <g fill="#d2e1ff" fill-opacity="0.55">
          <ellipse cx="-3" cy="-3" rx="4" ry="2"><animateTransform attributeName="transform" type="rotate" values="-20 -3 -3;-50 -3 -3;-20 -3 -3" dur="0.12s" repeatCount="indefinite"/></ellipse>
          <ellipse cx="3" cy="-3" rx="4" ry="2"><animateTransform attributeName="transform" type="rotate" values="20 3 -3;50 3 -3;20 3 -3" dur="0.12s" repeatCount="indefinite"/></ellipse>
        </g>
        <ellipse rx="1.8" ry="3.2" fill="#1a1a14"/>
        <ellipse cy="2.5" rx="1.6" ry="1.8" fill="#f0ffa0"/>
      </g>
    </g>

    <!-- Pointer, at the centre of the torch -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" values="560 190;560 190;480 300;480 300;560 190" keyTimes="0;0.8143;0.8429;0.9429;1" calcMode="spline" keySplines="0 0 1 1;.5 0 .3 1;0 0 1 1;.4 0 .2 1"/>
      <path d="M0 0 L0 20 L5.5 15 L9.5 24 L13 22.5 L9 13.5 L16 13.5 Z" fill="#fff" stroke="#000" stroke-width="1.2"/>
    </g>
  </g>
  <g font-size="17" fill="#e6edf3" text-anchor="middle">
    <text x="400" y="430">Spooky mode: outside the torch, the screen goes almost black<animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.1071;0.1072;1"/></text>
    <text x="400" y="430" opacity="0">Now and then the torch flickers<animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1071;0.1072;0.25;0.2501;1"/></text>
    <text x="400" y="430" opacity="0">A shadow cat drops by<animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.25;0.2501;0.4286;0.4287;1"/></text>
    <text x="400" y="430" opacity="0">It hunts fireflies in the dark<animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4286;0.4287;0.6786;0.6787;1"/></text>
    <text x="400" y="430" opacity="0">It creeps up to the edge of the light<animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6786;0.6787;0.8071;0.8072;1"/></text>
    <text x="400" y="430" opacity="0">…and bolts if you come at it<animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8071;0.8072;1"/></text>
  </g>
</svg>
